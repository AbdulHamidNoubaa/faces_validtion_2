{% extends "checkpoint/base.html" %}
{% load static %}

{% block title %}تسجيل الدخول — {{ site_title_ar }}{% endblock %}

{% block standalone_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <div class="auth-card__logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="m7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="auth-card__title">{{ site_title_ar }}</h1>
      <p class="auth-card__desc">{{ site_title_en }}</p>
    </div>

    <form method="post" class="auth-form">
      {% csrf_token %}

      {% if form.non_field_errors %}
      <div class="alert alert--error">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        {{ form.non_field_errors }}
      </div>
      {% endif %}

      <div class="form-group">
        <label class="form-label" for="id_username">{{ form.username.label }}</label>
        <input type="text" name="username" id="id_username" class="form-input" autofocus
               value="{{ form.username.value|default:'' }}" placeholder="اسم المستخدم">
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">{{ form.password.label }}</label>
        <input type="password" name="password" id="id_password" class="form-input" placeholder="كلمة المرور">
      </div>

      <button type="submit" class="btn btn--primary btn--block btn--lg">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        تسجيل الدخول
      </button>
    </form>

    <div class="text-center mt-4">
      <button class="theme-toggle" id="login-theme-toggle" aria-label="تبديل الوضع">
        <svg class="theme-icon--light" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-icon--dark" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="{% static 'checkpoint/js/theme.js' %}"></script>
<script>
  (function(){
    var btn = document.getElementById('login-theme-toggle');
    if (btn) {
      btn.addEventListener('click', function() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        if (isDark) { html.removeAttribute('data-theme'); localStorage.setItem('bfr-theme','light'); }
        else { html.setAttribute('data-theme','dark'); localStorage.setItem('bfr-theme','dark'); }
        document.querySelectorAll('.theme-icon--light').forEach(function(e){ e.style.display = isDark ? 'block' : 'none'; });
        document.querySelectorAll('.theme-icon--dark').forEach(function(e){ e.style.display = isDark ? 'none' : 'block'; });
      });
    }
  })();
</script>
{% endblock %}
