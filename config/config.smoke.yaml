# Smoke-test config (short epochs). For thesis results use config.yaml.
project:
  name: "banking-face-recognition-lowlight"
  seed: 42
  task: "closed_set_classification"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "outputs/models"
  logs_dir: "outputs/logs"
  reports_dir: "outputs/reports"
  label_map: "data/processed/label_map.json"
  splits_file: "data/processed/splits.json"

dataset:
  name: "lfw"
  min_images_per_identity: 10
  max_identities: 30
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  low_light:
    enabled: true
    fraction: 0.5
    brightness_range: [0.15, 0.45]
    noise_std: 8.0
    gamma_dark: [1.8, 2.8]

preprocessing:
  image_size: [224, 224]
  face_detector: "mediapipe"
  mediapipe_min_confidence: 0.5
  enhancement_method: "clahe_gamma"
  clahe:
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  gamma:
    value: 1.2
  retinex:
    sigma: 30.0
  augmentation:
    enabled: true
    rotation_range: 10
    horizontal_flip: true
    brightness_delta: 0.15
    noise_std: 5.0

model:
  architecture: "mobilenetv2"
  input_shape: [224, 224, 3]
  dropout: 0.3
  dense_units: 256
  freeze_base: true
  fine_tune:
    enabled: true
    unfreeze_last_n_layers: 30
    fine_tune_learning_rate: 0.00001

training:
  batch_size: 32
  epochs_head: 2
  epochs_finetune: 2
  learning_rate: 0.001
  optimizer: "adam"
  early_stopping_patience: 7
  reduce_lr_patience: 3
  reduce_lr_factor: 0.5
  min_lr: 0.0000001

evaluation:
  confidence_threshold: 0.50
  benchmark_warmup: 2
  benchmark_runs: 10

demo:
  title_ar: "نقطة التحقق المصرفية — تعرّف الوجوه تحت الإضاءة المنخفضة"
  title_en: "Banking Checkpoint — Low-Light Face Recognition"
  default_threshold: 0.50
